# Everything that happens before, during and after the talk.
#
# `task cost:check` is the command to run at the end of every session -- see
# docs/PLAN.md, "Three layers of guard". Nothing stays up between sessions.
#
# Infrastructure is Terragrunt: units in infra/<name>/terragrunt.hcl, the
# Terraform they run in infra/modules/<name>/, shared configuration in
# infra/root.hcl. The ephemeral demo environment is a stack:
# infra/demo/terragrunt.stack.hcl.
version: '3'

env:
  # No AWS_PROFILE here on purpose. Credentials come from the standard chain --
  # whatever `aws sts get-caller-identity` already resolves: an exported
  # AWS_PROFILE, plain AWS_ACCESS_KEY_ID, an SSO session, an instance role.
  # Pinning a profile name here would break every one of those but the first.
  # The account is still guarded: infra/root.hcl refuses a wrong-account apply.
  AWS_REGION: '{{.AWS_REGION | default "eu-central-1"}}'
  TG_NON_INTERACTIVE: '{{.TG_NON_INTERACTIVE | default "false"}}'

vars:
  PROJECT: probes-demo
  # What the closing card sends the room to, and what `task qr` encodes.
  DEMO_URL: '{{.DEMO_URL | default "https://github.com/DovnarAlexander/aws-community-central-asia-2026"}}'
  GUARDRAILS: infra/guardrails
  STACK: infra/demo
  TTL_HOURS: '{{.TTL_HOURS | default "8"}}'

tasks:
  default:
    desc: list what there is to do
    silent: true
    cmds:
      - task --list

  # ── the demo environment ───────────────────────────────────────────────────

  up:
    desc: bring up the whole environment — ~20 min, mostly the EKS control plane
    silent: true
    cmds:
      - task: stack:run
        vars: { TG_CMD: 'apply -auto-approve' }
      - task: kubeconfig
      - cmd: |
          printf '\n  \033[1;32menvironment up\033[0m\n'
          printf '  everything is tagged ExpiresAt=%s — the reaper takes it from there.\n' "$(PROBES_TTL_HOURS={{.TTL_HOURS}} ./scripts/expires-at.sh)"
          printf '  \033[1mtask down\033[0m when you stop working. not later.\n\n'

  down:
    desc: destroy the environment, then prove it is gone
    silent: true
    cmds:
      # The sweep runs even when the destroy fails, which is exactly when it
      # matters: a half-finished destroy leaves a cluster billing while the
      # command that was supposed to remove it has already exited non-zero.
      - defer:
          cmd: |
            printf '\n  verifying nothing survived the destroy\n'
            ./scripts/cost-check.sh
      - task: down:workloads
      - task: stack:run
        vars: { TG_CMD: 'destroy -auto-approve' }

  down:workloads:
    internal: true
    silent: true
    cmds:
      # Remove what the demo created inside the cluster before Terraform tries
      # to uninstall the charts that own the CRDs behind it.
      #
      # A leftover ScaledObject or TriggerAuthentication keeps its CRD alive,
      # the CRD keeps the KEDA release alive, and `helm uninstall` sits there
      # until it times out -- which aborts the whole destroy with an EKS cluster
      # still running. Learned the expensive way.
      - |
        kubectl delete scaledobject,triggerauthentication --all -A --timeout=30s 2>/dev/null || true
        kubectl delete ns demo --timeout=60s 2>/dev/null || true
        printf '  \033[2mcluster workloads cleared\033[0m\n'

  plan:
    desc: what would change in the environment
    silent: true
    cmds:
      - task: stack:run
        vars: { TG_CMD: 'plan' }

  stack:run:
    internal: true
    silent: true
    cmds:
      - |
        # One instant shared by every unit in the run, so repeated plans do not
        # churn the ExpiresAt tag.
        export PROBES_EXPIRES_AT="$(PROBES_TTL_HOURS={{.TTL_HOURS}} ./scripts/expires-at.sh)"
        cd {{.STACK}}
        terragrunt stack run -- {{.TG_CMD}}

  stack:generate:
    desc: regenerate .terragrunt-stack from terragrunt.stack.hcl
    dir: '{{.STACK}}'
    cmds:
      - terragrunt stack generate

  kubeconfig:
    desc: point kubectl at the demo cluster
    silent: true
    cmds:
      - aws eks update-kubeconfig --name {{.PROJECT}} --alias {{.PROJECT}} >/dev/null
      - cmd: printf '  \033[1;32m✓\033[0m kubectl now points at {{.PROJECT}}\n'

  db:snapshot:
    desc: snapshot the seeded database so later runs restore instead of re-seeding
    silent: true
    cmds:
      - |
        SNAP="{{.PROJECT}}-seeded-$(date -u +%Y%m%d-%H%M%S)"
        aws rds create-db-snapshot \
          --db-instance-identifier {{.PROJECT}} \
          --db-snapshot-identifier "$SNAP" \
          --query 'DBSnapshot.DBSnapshotIdentifier' --output text
        printf '  restore from it by setting snapshot_identifier in infra/units/database\n'

  # ── application ────────────────────────────────────────────────────────────

  images:
    desc: build the image and push it to ECR — arm64, to match the nodes
    silent: true
    cmds:
      - |
        # `terragrunt output -raw` pads its value with trailing spaces, which
        # turn a tag into garbage the registry then reports as a missing
        # repository. Strip before use.
        REPO=$(cd {{.STACK}}/.terragrunt-stack/registry && terragrunt output -raw repository_url 2>/dev/null | tr -d '[:space:]')
        [ -n "$REPO" ] || { printf '  \033[1;31m✗\033[0m no ECR repository — run task up\n'; exit 1; }
        REGISTRY=${REPO%%/*}

        # The registry token is written straight into an isolated docker config
        # rather than passed through `docker login`. On macOS the login path
        # delegates to the keychain, which needs a click to unlock and fails
        # outright in any non-interactive run. The token lasts twelve hours and
        # goes away with the directory.
        DOCKER_CONFIG=$(mktemp -d)
        export DOCKER_CONFIG
        trap 'rm -rf "$DOCKER_CONFIG"' EXIT
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" \
          "$(printf 'AWS:%s' "$(aws ecr get-login-password)" | base64 | tr -d '\n')" \
          > "$DOCKER_CONFIG/config.json"

        docker build --platform linux/arm64 -t "$REPO:latest" app
        docker push "$REPO:latest"
        printf '\n  \033[1;32m✓\033[0m %s:latest\n\n' "$REPO"

  secrets:
    desc: the namespace, the Service and the database DSN — everything the demo assumes exists
    silent: true
    cmds:
      # Both 00- files, because the Service is what `svc.demo.svc.cluster.local`
      # resolves to and the load generator only ever reaches the api through it.
      # It used to be applied by nothing at all: every request the generator made
      # was a connection error, so incident 1 measured no load and incident 2 enqueued no
      # work, and both incidents ran to the end looking merely disappointing.
      - kubectl apply -f k8s/00-namespace.yaml -f k8s/00-service.yaml
      - |
        DSN=$(aws ssm get-parameter --name /{{.PROJECT}}/database/dsn --with-decryption \
              --query 'Parameter.Value' --output text)
        kubectl -n demo create secret generic db \
          --from-literal=dsn="$DSN" \
          --dry-run=client -o yaml | kubectl apply -f -
        printf '  \033[1;32m✓\033[0m secret/db\n'

  seed:
    desc: load 2M rows into RDS — a couple of minutes, run once per environment
    silent: true
    cmds:
      - task: secrets
      - kubectl -n demo create configmap seed-sql --from-file=seed.sql=db/seed.sql --dry-run=client -o yaml | kubectl apply -f -
      - kubectl -n demo delete job seed --ignore-not-found
      - kubectl apply -f k8s/seed-job.yaml
      - cmd: printf '\n  waiting for the seed job\n'
      - kubectl -n demo wait --for=condition=complete job/seed --timeout=900s
      - kubectl -n demo logs job/seed --tail=5

  bootstrap:
    desc: everything the night before — infra, cluster prerequisites, image, data
    cmds:
      - task: up
      # Both of these used to be reached only through `seed`, which is a problem
      # the day the database is restored from a snapshot instead of seeded: that
      # path skips seed, and with it the namespace, the Service and the psql pod
      # that the stat panel and three steps of incident 2 exec into. They are cheap
      # and idempotent, so they run here in their own right.
      - task: secrets
      - task: dbshell
      - task: images
      - task: seed
      - cmd: printf '\n  \033[1;32mready\033[0m — consider task db:snapshot so the next run restores instead of re-seeding\n\n'
        silent: true

  # ── cost control ───────────────────────────────────────────────────────────

  stage:
    desc: open the tmux layout and start the driver — the one command on stage
    interactive: true
    cmds:
      - ./stage

  reset:
    desc: one command back to the state the show starts from, from any state
    silent: true
    cmds:
      # Both halves, in this order. `secrets` puts back what has to exist --
      # namespace, Service, the DSN out of SSM -- and every one of those applies
      # is a no-op when it is already there. `./demo --reset` then removes what
      # must not: the workloads, the queue contents and the last run's numbers.
      #
      # Safe to run from any state, which is the point: after a smoke run, on a
      # half-built cluster, or twice in a row.
      - task: secrets
      - ./demo --reset

  dbshell:
    desc: the always-on psql pod the stat panel and the driver exec into
    cmds:
      - kubectl apply -f k8s/dbshell.yaml
      - kubectl -n demo rollout status deploy/dbshell --timeout=180s

  # ── the deck ───────────────────────────────────────────────────────────────
  # The talk is the terminal. This is the fallback for the day the cluster is
  # not available, and the artefact that gets shared afterwards.

  deck:
    desc: open the deck in a browser, live-reloading — slides/talk.md
    interactive: true
    cmds:
      - slidev slides/talk.md

  deck:build:
    desc: build the deck to slides/dist — this is the one to present from
    silent: true
    cmds:
      - slidev build slides/talk.md --out dist --base ./
      - cmd: printf '\n  \033[1;32m✓\033[0m slides/dist — open index.html, works offline\n\n'

  deck:pdf:
    desc: export a PDF — the only thing SlideShare can take, since it plays nothing
    silent: true
    cmds:
      # Recordings, clicks and mermaid animation do not survive a PDF. What
      # survives is the story and the QR, which is what a handout is for.
      - |
        node -e "require.resolve('playwright-chromium')" >/dev/null 2>&1 || \
        NODE_PATH="$(npm root -g)" node -e "require.resolve('playwright-chromium')" >/dev/null 2>&1 || {
          printf '  export needs Playwright once: \033[1mnpm i -g playwright-chromium\033[0m\n' >&2
          exit 1
        }
      - slidev export slides/talk.md --output slides/talk.pdf --with-clicks
      - cmd: printf '\n  \033[1;32m✓\033[0m slides/talk.pdf\n\n'

  deck:record:
    desc: record one cast for the deck — task deck:record -- incident1 [start-step]
    interactive: true
    cmds:
      - |
        NAME="{{index .MATCH 0}}"; NAME="${NAME:-$(echo '{{.CLI_ARGS}}' | awk '{print $1}')}"
        START=$(echo '{{.CLI_ARGS}}' | awk '{print $2}')
        [ -n "$NAME" ] || { printf '  usage: task deck:record -- incident1 [1.1]\n' >&2; exit 2; }
        command -v asciinema >/dev/null 2>&1 || {
          printf '  asciinema not installed: \033[1mbrew install asciinema\033[0m\n' >&2; exit 1
        }
        mkdir -p slides/public/casts
        printf '\n  recording %s -- the stage opens, run the demo, then exit tmux to stop\n' "$NAME"
        printf '  %sthe cast keeps text as text, so it stays sharp on a projector%s\n\n' "$(tput dim 2>/dev/null)" "$(tput sgr0 2>/dev/null)"
        DEMO_ARGS="$START" asciinema rec --overwrite --cols 120 --rows 36 \
          --title "probes-demo $NAME" --command ./stage \
          "slides/public/casts/$NAME.cast"
        printf '\n  \033[1;32m✓\033[0m slides/public/casts/%s.cast\n\n' "$NAME"

  qr:
    desc: render the closing QR into docs/qr.txt and slides/public/qr.svg — run once, both are committed
    silent: true
    cmds:
      - |
        python3 -c 'import segno' >/dev/null 2>&1 || {
          printf '  qr needs segno: \033[1mpipx install segno\033[0m (or pip install segno)\n' >&2
          exit 1
        }
        mkdir -p slides/public
        python3 - "{{.DEMO_URL}}" <<'PY'
        import io, sys, segno

        url = sys.argv[1]
        qr = segno.make(url, error='m')

        # Half blocks, so the code comes out square on a terminal whose cells are
        # taller than they are wide, and half the height of the ANSI rendering --
        # which does not fit the driver pane. The glyphs draw the LIGHT modules,
        # which is the right way round for the stage's dark terminal.
        buf = io.StringIO()
        qr.terminal(buf, compact=True, border=1)
        open('docs/qr.txt', 'w').write(buf.getvalue())

        # SVG rather than PNG for the closing slide: a QR is line art, and line
        # art stays sharp at whatever size the projector is running.
        qr.save('slides/public/qr.svg', scale=6, border=2,
                dark='#1e1e2f', light='#ffffff')
        PY
        printf '  \033[1;32m✓\033[0m docs/qr.txt and slides/public/qr.svg — %s\n' "{{.DEMO_URL}}"

  deck:check:
    desc: check that every slide fits the canvas at every click — needs `task deck` running
    silent: true
    cmds:
      # Slidev clips at 980x551 without a word, so a slide that grew by one line
      # looks right in the editor and loses its last sentence on the projector.
      - NODE_PATH="$(npm root -g)" node scripts/check-slides.mjs {{.DECK_URL | default "http://localhost:3030"}}

  deck:diagrams:
    desc: re-render slides/diagrams/*.excalidraw.json to slides/public/diagrams/*.svg
    silent: true
    cmds:
      # The slides load flat SVGs, not the Excalidraw scenes. The renderer that
      # turns one into the other comes from a CDN, and this deck has to survive a
      # venue with no network -- so the CDN is used here, once, and what ships is
      # the SVG. Both the sources and the output are committed.
      - |
        node -e "require.resolve('playwright-chromium')" >/dev/null 2>&1 || \
        NODE_PATH="$(npm root -g)" node -e "require.resolve('playwright-chromium')" >/dev/null 2>&1 || {
          printf '  rendering needs Playwright once: \033[1mnpm i -g playwright-chromium\033[0m\n' >&2
          exit 1
        }
      - python3 scripts/build-diagrams.py
      - NODE_PATH="$(npm root -g)" node scripts/render-diagrams.mjs

  preflight:
    desc: one screen of checks — run this backstage before going on
    silent: true
    cmds:
      - ./scripts/preflight.sh

  smoke:
    desc: run the whole demo unattended and check the failures still happen (~20 min)
    silent: true
    cmds:
      - ./scripts/smoke.sh

  cost:check:
    desc: is anything running that costs money? run this at the end of every session
    silent: true
    cmds:
      - ./scripts/cost-check.sh

  cost:check:all:
    desc: same sweep across every region — slower, for when something escaped
    silent: true
    cmds:
      - ./scripts/cost-check.sh --all-regions

  cost:spend:
    desc: month-to-date spend by service
    silent: true
    cmds:
      - |
        start=$(date -v1d +%Y-%m-%d 2>/dev/null || date -d "$(date +%Y-%m-01)" +%Y-%m-%d)
        end=$(date -v+1d +%Y-%m-%d 2>/dev/null || date -d tomorrow +%Y-%m-%d)
        aws ce get-cost-and-usage \
          --time-period Start=$start,End=$end \
          --granularity MONTHLY --metrics UnblendedCost \
          --group-by Type=DIMENSION,Key=SERVICE \
        | jq -r '.ResultsByTime[0].Groups[]
                 | select((.Metrics.UnblendedCost.Amount|tonumber) > 0.005)
                 | "  \(.Metrics.UnblendedCost.Amount|tonumber*100|round/100)\t\(.Keys[0])"' \
        | sort -rn \
        | awk -F'\t' '{printf "  $%-8s %s\n", $1, $2}'
        printf '\n'

  # ── guardrails ─────────────────────────────────────────────────────────────

  guardrails:check-email:
    internal: true
    silent: true
    cmds:
      - |
        if [ -n "${PROBES_ALERT_EMAIL:-}" ]; then exit 0; fi
        if [ -f infra/local.hcl ] && grep -q 'alert_email' infra/local.hcl; then exit 0; fi
        printf '\n  \033[1;31m✗\033[0m no alert address configured — the guards would report into the void.\n\n'
        printf '    export PROBES_ALERT_EMAIL=you@example.com\n'
        printf '    or write infra/local.hcl (gitignored):  locals { alert_email = "you@example.com" }\n\n'
        exit 1

  guardrails:validate:
    desc: check the HCL parses and the inputs line up with the module's variables
    silent: true
    cmds:
      - terragrunt hcl validate --inputs
      - cmd: printf '  \033[1;32m✓\033[0m guardrails HCL valid\n'

  guardrails:plan:
    desc: show what the guardrails stack would change
    deps: [guardrails:check-email]
    dir: '{{.GUARDRAILS}}'
    cmds:
      - terragrunt run -- plan

  guardrails:apply:
    desc: create the reaper, the schedule and the budget alarms
    deps: [guardrails:check-email]
    dir: '{{.GUARDRAILS}}'
    cmds:
      - terragrunt run -- apply
      - cmd: |
          printf '\n  \033[1;33m!\033[0m confirm the SNS subscription in your inbox.\n'
          printf '    until you click that link, the reaper reports into the void.\n\n'
        silent: true

  guardrails:destroy:
    desc: "remove the guards — only when the project is over, after task down"
    dir: '{{.GUARDRAILS}}'
    prompt: This removes the reaper and the budget alarms. Everything else is unguarded afterwards. Continue?
    cmds:
      - terragrunt run -- destroy

  guardrails:test:
    desc: prove the reaper actually reaps — creates a doomed t4g.nano, kills it, cleans up
    silent: true
    env:
      TG_NON_INTERACTIVE: 'true'
    cmds:
      # Always tear the scratch unit down, even if a step in the middle fails.
      # A test of the cost guards must not be the thing that leaks cost.
      - defer: { task: scratch:destroy }
      - printf '\n  \033[1mstep 1\033[0m  create a deliberately expired instance\n\n'
      - cd {{.ROOT_DIR}}/infra/scratch && terragrunt run -- apply -auto-approve
      - printf '\n  \033[1mstep 2\033[0m  the sweep should now find it\n'
      - '{{.ROOT_DIR}}/scripts/cost-check.sh || true'
      - printf '\n  \033[1mstep 3\033[0m  the reaper should terminate it\n'
      - task: reaper:run
      - printf '  \033[1mstep 4\033[0m  remove the leftover VPC and subnet\n\n'
      - cd {{.ROOT_DIR}}/infra/scratch && terragrunt run -- destroy -auto-approve
      - printf '\n  \033[1mstep 5\033[0m  the sweep should be clean again\n'
      - '{{.ROOT_DIR}}/scripts/cost-check.sh'
      - printf '  \033[1;32m✓\033[0m guards verified end to end\n\n'

  scratch:destroy:
    desc: emergency cleanup if guardrails:test was interrupted halfway
    silent: true
    env:
      TG_NON_INTERACTIVE: 'true'
    cmds:
      - cd {{.ROOT_DIR}}/infra/scratch && terragrunt run -- destroy -auto-approve 2>/dev/null || true

  # ── the reaper ─────────────────────────────────────────────────────────────

  reaper:run:
    desc: invoke the dead-man switch now instead of waiting for the hour
    silent: true
    cmds:
      - |
        out=$(mktemp)
        aws lambda invoke \
          --function-name {{.PROJECT}}-reaper \
          --cli-binary-format raw-in-base64-out \
          --payload '{"source":"manual"}' \
          "$out" >/dev/null
        printf '\n'
        jq -r '"  reaped: \(.reaped)", (.actions[]? | "  · \(.)"), (.errors[]? | "  ! \(.)")' "$out" 2>/dev/null || cat "$out"
        printf '\n'
        rm -f "$out"

  reaper:logs:
    desc: recent reaper runs
    silent: true
    cmds:
      - aws logs tail /aws/lambda/{{.PROJECT}}-reaper --since 24h --format short
