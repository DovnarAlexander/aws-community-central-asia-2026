# Incident 1, step 1.2 -- Ruslan fixes production the way Ruslan fixes production.
#
# 25 is bigger than 15, the CrashLoop stops, and the fix holds until the day the
# service starts taking longer. It is a bet that tomorrow looks like today.
#
# These numbers used to be 40 against 30. They are half that now because the
# failure is pure arithmetic -- initialDelay + failureThreshold x period against
# the warmup -- and arithmetic is as true at 25 seconds as at 40. What the
# halving bought is most of a minute of stage time, which the theory cards now
# spend explaining the probe while the rollout settles.
#
# Green here:  warmup 15 < initialDelay 25, ten seconds of margin.
# Broken next: the step sets WARMUP_SECONDS=50 against 25 + 3x5 = 40 seconds of
# patience, so the kill lands at 40 and the pod would have been ready at 50.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc
  namespace: demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: svc }
  template:
    metadata:
      labels: { app: svc }
    spec:
      serviceAccountName: demo
      terminationGracePeriodSeconds: 2
      nodeSelector:
        role: demo
      containers:
        - name: svc
          image: ${IMAGE}
          command: ["/api"]
          ports:
            - containerPort: 8080
          env:
            - name: WARMUP_SECONDS
              value: "15"
            - name: HEALTHZ_MODE
              value: "local"
            - name: READY_MODE
              value: "cached"
            - name: DSN
              valueFrom:
                secretKeyRef: { name: db, key: dsn }
          resources:
            requests: { cpu: "250m", memory: "64Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 25
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
