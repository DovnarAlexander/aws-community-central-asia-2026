# Act 1, beat 4 -- the production configuration, and the first real traffic.
#
# The start is fixed, so the warmup drops to 10 seconds and the replica count
# goes to three. Nobody touched the liveness probe, because it is green.
#
# HEALTHZ_MODE=db is the whole beat: /healthz now queues for the same worker
# slot and the same pooled connection that /work is using. Under load the queue
# grows past timeoutSeconds: 1, three checks in a row miss, and kubelet restarts
# three entirely healthy replicas for being busy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc
  namespace: demo
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: svc }
  template:
    metadata:
      labels: { app: svc }
    spec:
      serviceAccountName: demo
      terminationGracePeriodSeconds: 2
      nodeSelector:
        role: demo
      containers:
        - name: svc
          image: ${IMAGE}
          command: ["/api"]
          ports:
            - containerPort: 8080
          env:
            - name: WARMUP_SECONDS
              value: "10"
            - name: WORK_LATENCY_MS
              value: "200"
            - name: POOL_MAX
              value: "4"
            - name: HEALTHZ_MODE
              value: "db"
            - name: READY_MODE
              value: "cached"
            - name: DSN
              valueFrom:
                secretKeyRef: { name: db, key: dsn }
          resources:
            requests: { cpu: "250m", memory: "64Mi" }
          startupProbe:
            httpGet: { path: /startupz, port: 8080 }
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
